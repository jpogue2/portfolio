<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Portal (Web)</title>

    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }

      /* Fullscreen canvas */
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        border: 0;
      }

      /* Click-to-start overlay (blocks interaction until user clicks) */
      #startOverlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.65);
        z-index: 10;
      }
      #startOverlay button {
        font-size: 1.1rem;
        padding: 0.9rem 1.2rem;
        border-radius: 12px;
        border: 0;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="startOverlay">
      <button id="startButton" disabled>Loading…</button>
    </div>

    <script type="text/javascript">
      const canvasElement = document.getElementById("canvas");
      const startOverlay = document.getElementById("startOverlay");
      const startButton = document.getElementById("startButton");

      // Helpful error visibility (since we’re not using the default Emscripten UI)
      window.addEventListener("error", (e) => {
        console.error("Window error:", e.error || e.message);
      });
      window.addEventListener("unhandledrejection", (e) => {
        console.error("Unhandled promise rejection:", e.reason);
      });

      canvasElement.addEventListener(
        "webglcontextlost",
        (e) => {
          alert("WebGL context lost. You will need to reload the page.");
          e.preventDefault();
        },
        false
      );

      function resizeCanvasToDisplaySize() {
        const rect = canvasElement.getBoundingClientRect();
        const w = Math.max(1, Math.floor(rect.width));
        const h = Math.max(1, Math.floor(rect.height));

        // Resize actual drawing buffer
        if (canvasElement.width !== w) canvasElement.width = w;
        if (canvasElement.height !== h) canvasElement.height = h;
      }

      window.addEventListener("resize", resizeCanvasToDisplaySize);

      // NOTE: Option A:
      // - We DO allow Emscripten to auto-run main().
      // - We DO NOT call Module.callMain().
      // - The overlay blocks interaction until user click (and we resume audio on click).
      var Module = {
        canvas: canvasElement,

        print: (...args) => console.log(...args),
        printErr: (...args) => console.error(...args),

        // Some builds expect these to exist.
        setStatus: (text) => console.log("[emscripten]", text),
        monitorRunDependencies: (left) => console.log("[emscripten] deps left:", left),

        onRuntimeInitialized() {
          console.log("[emscripten] runtime initialized");
          resizeCanvasToDisplaySize();
          startButton.disabled = false;
          startButton.textContent = "Click to Start";
        },
      };

      // Click-to-start: unlock audio + hide overlay.
      startButton.addEventListener("click", async () => {
        try {
          if (Module.SDL2 && Module.SDL2.audioContext && Module.SDL2.audioContext.state === "suspended") {
            await Module.SDL2.audioContext.resume();
          }
        } catch (e) {
          // ignore
        }

        startOverlay.style.display = "none";
        resizeCanvasToDisplaySize();
      });
    </script>

    <!-- Avoid async while debugging startup order -->
    <script type="text/javascript" src="Lab12.js"></script>
  </body>
</html>
